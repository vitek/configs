# kitty config mimicking gnome-terminal (GNOME dark profile)
# Generated to match ~/.config/dconf gnome-terminal profile:
#   font: Ubuntu Mono 13, GNOME palette, audible bell off.

#: Fonts {{{
font_family      Ubuntu Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# kitty >=0.28 applies gamma-corrected compositing by default, which makes text
# look bolder/thicker than GTK apps. "legacy" matches gnome-terminal's lighter
# rendering.
text_composition_strategy legacy
#: }}}

#: Colors — GNOME dark palette (exact match to gnome-terminal) {{{
foreground            #d0cfcc
background            #171421
selection_foreground  #171421
selection_background  #d0cfcc

# cursor follows text like gnome-terminal
cursor                #d0cfcc
cursor_text_color     background

# URL underline color
url_color             #2a7bde

# normal
color0  #171421
color1  #c01c28
color2  #26a269
color3  #a2734c
color4  #12488b
color5  #a347ba
color6  #2aa1b3
color7  #d0cfcc

# bright
color8  #5e5c64
color9  #f66151
color10 #33d17a
color11 #e9ad0c
color12 #2a7bde
color13 #c061cb
color14 #33c7de
color15 #ffffff
#: }}}

#: Cursor — filled block, no blinking {{{
cursor_shape           block
cursor_blink_interval  0
# kitty's shell integration changes the cursor to a thin beam at the prompt
# (no-cursor) and rewrites the window title on every command, which makes the
# tab flicker (no-title). Disable both.
shell_integration      no-cursor no-title
#: }}}

#: Scrollback — gnome-terminal default is 10000 lines {{{
scrollback_lines       10000
#: }}}

#: Remote control — enables `kitty @` (analog of gnome-terminal --tab) {{{
allow_remote_control   yes
listen_on              unix:@kitty
#: }}}

#: Bell — off, matching audible-bell=false {{{
enable_audio_bell      no
visual_bell_duration   0
window_alert_on_bell   yes
#: }}}

#: Mouse — gnome-terminal behavior {{{
mouse_hide_wait        3.0
url_style              straight
# постоянно подчёркивать OSC 8 hyperlinks (не только при наведении); стиль/цвет
# берутся из url_style/url_color
underline_hyperlinks   always
open_url_with          default
copy_on_select         no
strip_trailing_spaces  smart
# match gnome-terminal word selection separators
select_by_word_characters @-./_~?&=%+#
# gnome-terminal style links: ctrl+click opens the link under the cursor
# instantly, a plain click only selects / positions the cursor. kitty's default
# (plain click opens links) is laggy because it must first rule out a
# double-click, so we move link opening onto ctrl+click.
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map left click ungrabbed mouse_handle_click selection prompt
#: }}}

#: Window / layout {{{
remember_window_size   no
initial_window_width   80c
initial_window_height  24c
window_padding_width   2
confirm_os_window_close 1
#: }}}

#: Tab bar — custom (tab numbers, active one highlighted); see tab_bar.py {{{
tab_bar_edge           top
tab_bar_style          custom
# always show the bar, even with a single tab
tab_bar_min_tabs       1
tab_separator          "  "
# watcher puts "[i/n] title" into the OS window title (see watcher.py)
watcher                watcher.py
# base the title on the working directory (stable) instead of the running
# command, so the tab does not flicker while commands run
tab_title_template     "{tab.active_wd}"

# no italic/bold on tabs
active_tab_font_style    normal
inactive_tab_font_style  normal

# bar matches the terminal background; active tab sits in a lighter box
tab_bar_background       #171421
inactive_tab_background  #171421
inactive_tab_foreground  #d0cfcc
active_tab_background     #3d3d3d
active_tab_foreground     #ffffff
#: }}}

#: Keyboard shortcuts — gnome-terminal bindings {{{
clear_all_shortcuts    yes

# Clipboard
map ctrl+shift+c       copy_to_clipboard
map ctrl+shift+v       paste_from_clipboard
map ctrl+insert        copy_to_clipboard
map shift+insert       paste_from_selection

# Tabs
map alt+t              select_tab
map ctrl+shift+t       new_tab
map ctrl+shift+w       close_tab
map ctrl+page_up       previous_tab
map ctrl+page_down     next_tab
map ctrl+shift+page_up move_tab_backward
map ctrl+shift+page_down move_tab_forward
map alt+1              goto_tab 1
map alt+2              goto_tab 2
map alt+3              goto_tab 3
map alt+4              goto_tab 4
map alt+5              goto_tab 5
map alt+6              goto_tab 6
map alt+7              goto_tab 7
map alt+8              goto_tab 8
map alt+9              goto_tab 9

# Windows
map ctrl+shift+n       new_os_window
map ctrl+shift+q       quit

# Font size
map ctrl+plus          change_font_size all +1.0
map ctrl+equal         change_font_size all +1.0
map ctrl+minus         change_font_size all -1.0
map ctrl+0             change_font_size all 0

# Scrolling (gnome-terminal uses shift+page_up/down and shift+home/end)
map shift+page_up      scroll_page_up
map shift+page_down    scroll_page_down
map shift+home         scroll_home
map shift+end          scroll_end
map ctrl+shift+up      scroll_line_up
map ctrl+shift+down    scroll_line_down

# Search / find (gnome-terminal Ctrl+Shift+F)
map ctrl+shift+f       show_scrollback

# Full screen
map f11                toggle_fullscreen

# Cyrillic (ЙЦУКЕН) duplicates — kitty matches shortcuts by the character the
# key produces, so with a Russian layout the Latin maps above do not fire.
# These bind the Cyrillic char of the same physical key to the same action.
# NB: kitty has no inline comments, so no trailing "# x" notes here.
# с=c  м=v  е=t  ц=w  т=n  й=q  а=f
map ctrl+shift+с       copy_to_clipboard
map ctrl+shift+м       paste_from_clipboard
map ctrl+shift+е       new_tab
map ctrl+shift+ц       close_tab
map ctrl+shift+т       new_os_window
map ctrl+shift+й       quit
map ctrl+shift+а       show_scrollback
#: }}}

#: Cyrillic Ctrl/Alt -> Latin control code / M-<latin> for terminal apps {{{
# Makes C-a C-e C-k C-u ... and M-x M-w M-d ... work inside kitty (bash,
# readline, tmux, TUI editors, claude) even with the Russian layout active.
# ctrl+<cyr> -> the ASCII control byte; alt+<cyr> -> ESC + latin (i.e. Meta).
# NB: only affects programs running INSIDE kitty; GUI Emacs is unaffected.
map ctrl+ф send_text all \x01
map ctrl+и send_text all \x02
map ctrl+с send_text all \x03
map ctrl+в send_text all \x04
map ctrl+у send_text all \x05
map ctrl+а send_text all \x06
map ctrl+п send_text all \x07
map ctrl+р send_text all \x08
map ctrl+ш send_text all \x09
map ctrl+о send_text all \x0a
map ctrl+л send_text all \x0b
map ctrl+д send_text all \x0c
map ctrl+ь send_text all \x0d
map ctrl+т send_text all \x0e
map ctrl+щ send_text all \x0f
map ctrl+з send_text all \x10
map ctrl+й send_text all \x11
map ctrl+к send_text all \x12
map ctrl+ы send_text all \x13
map ctrl+е send_text all \x14
map ctrl+г send_text all \x15
map ctrl+м send_text all \x16
map ctrl+ц send_text all \x17
map ctrl+ч send_text all \x18
map ctrl+н send_text all \x19
map ctrl+я send_text all \x1a
map alt+ф  send_text all \x1ba
map alt+и  send_text all \x1bb
map alt+с  send_text all \x1bc
map alt+в  send_text all \x1bd
map alt+у  send_text all \x1be
map alt+а  send_text all \x1bf
map alt+п  send_text all \x1bg
map alt+р  send_text all \x1bh
map alt+ш  send_text all \x1bi
map alt+о  send_text all \x1bj
map alt+л  send_text all \x1bk
map alt+д  send_text all \x1bl
map alt+ь  send_text all \x1bm
map alt+т  send_text all \x1bn
map alt+щ  send_text all \x1bo
map alt+з  send_text all \x1bp
map alt+й  send_text all \x1bq
map alt+к  send_text all \x1br
map alt+ы  send_text all \x1bs
map alt+е  send_text all \x1bt
map alt+г  send_text all \x1bu
map alt+м  send_text all \x1bv
map alt+ц  send_text all \x1bw
map alt+ч  send_text all \x1bx
map alt+н  send_text all \x1by
map alt+я  send_text all \x1bz
#: }}}
