# tmux-256color (не screen-256color): свежий terminfo с корректной обработкой
# фоновой заливки и расширениями true-color. На screen-256color новые TUI
# (в т.ч. Claude Code с фоновыми плашками) рисуют «дырявый» фон — на пробелах
# заливка пропадает.
set -g default-terminal "tmux-256color"
# Прокинуть true-color наружу: внешний терминал (xterm-256color, COLORTERM=truecolor)
# умеет 24-бит — без RGB tmux квантует цвета и плодит артефакты.
set -as terminal-features ",*:RGB"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-t

bind-key -T prefix t send-prefix
bind-key -T prefix C-t last-window

bind-key -T prefix Escape copy-mode
bind-key -T copy-mode Escape send-keys -X cancel

# Кириллические дубли prefix-привязок (ЙЦУКЕН), чтобы C-t <буква> работал и при
# русской раскладке.
bind-key -T prefix е send-prefix           ;# t
bind-key -T prefix с new-window            ;# c
bind-key -T prefix т next-window           ;# n
bind-key -T prefix з previous-window       ;# p
bind-key -T prefix д last-window           ;# l
bind-key -T prefix в detach-client         ;# d
bind-key -T prefix щ select-pane -t :.+    ;# o
bind-key -T prefix я resize-pane -Z        ;# z
bind-key -T prefix ы choose-tree -Zs       ;# s
bind-key -T prefix ц choose-tree -Zw       ;# w
bind-key -T prefix ч confirm-before -p "kill-pane #P? (y/n)" kill-pane  ;# x

set-option -g history-limit 100000

#bind s set-option -g status
#bind C-s set-option -g status

#set-option -g status-bg black
